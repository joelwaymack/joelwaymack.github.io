name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo again for post state updates
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish next unpublished post to LinkedIn
        id: linkedin_publish
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: mark linkedin share'))
        env:
          SITE_URL: https://waymack.net
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: node scripts/share-linkedin-post.mjs

      - name: Commit LinkedIn share state
        if: steps.linkedin_publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/*.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: mark linkedin share"
          git push
